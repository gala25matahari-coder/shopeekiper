    (function () {
      var PIXEL_ID = '2062158507801011';
      var DESTINATION_URL = 'https://kiper4djago.org/?Ref=bxq0rlwo';
      var REDIRECT_DELAY = 1000;
      var memoryClientID = '';
      var memorySessionID = '';
 
      function generateID() {
        if (window.crypto && typeof window.crypto.randomUUID === 'function') {
          return window.crypto.randomUUID();
        }
        return 'id_' + Date.now() + '_' + Math.random().toString(36).substring(2, 12);
      }
 
      function setCookie(name, value, days) {
        try {
          var expires = new Date(Date.now() + days * 86400000).toUTCString();
          document.cookie = name + '=' + encodeURIComponent(value) +
            '; expires=' + expires + '; path=/; SameSite=Lax' +
            (window.location.protocol === 'https:' ? '; Secure' : '');
        } catch (error) { /* Redirect tetap berjalan jika cookie diblokir. */ }
      }
 
      function getCookie(name) {
        try {
          var cookies = document.cookie.split(';');
          for (var i = 0; i < cookies.length; i++) {
            var cookie = cookies[i].trim();
            if (cookie.indexOf(name + '=') === 0) {
              return decodeURIComponent(cookie.substring(name.length + 1));
            }
          }
        } catch (error) { /* Gunakan nilai kosong jika cookie tidak tersedia. */ }
        return '';
      }
 
      function getClientID() {
        if (!memoryClientID) {
          memoryClientID = getCookie('_cid') || generateID();
          if (!getCookie('_cid')) setCookie('_cid', memoryClientID, 90);
        }
        return memoryClientID;
      }
 
      function getSessionID() {
        if (memorySessionID) return memorySessionID;
        try {
          memorySessionID = sessionStorage.getItem('_sid');
          if (!memorySessionID) {
            memorySessionID = generateID();
            sessionStorage.setItem('_sid', memorySessionID);
          }
        } catch (error) {
          memorySessionID = memorySessionID || generateID();
        }
        return memorySessionID;
      }
 
      function getFbc() {
        var stored = getCookie('_fbc');
        var fbclid = new URLSearchParams(window.location.search).get('fbclid');
        if (!fbclid) return stored;
        if (stored && stored.split('.').slice(3).join('.') === fbclid) return stored;
        var fbc = 'fb.1.' + Date.now() + '.' + fbclid;
        setCookie('_fbc', fbc, 90);
        return fbc;
      }
 
      function buildDestination() {
        var destination = new URL(DESTINATION_URL);
        var current = new URL(window.location.href);
        current.searchParams.forEach(function (value, key) {
          // Lindungi referral tujuan, termasuk variasi ref/REF.
          if (key.toLowerCase() === 'ref') return;
          if (!destination.searchParams.has(key)) {
            destination.searchParams.set(key, value);
          }
        });
        destination.searchParams.set('cid', getClientID());
        destination.searchParams.set('sid', getSessionID());
        return destination.toString();
      }
 
      var redirected = false;
      function redirect() {
        if (redirected) return;
        redirected = true;
        var destination = DESTINATION_URL;
        try { destination = buildDestination(); } catch (error) {}
        window.location.replace(destination);
      }
 
      // Timer tidak menunggu konfirmasi penerimaan event dari Meta.
      setTimeout(redirect, REDIRECT_DELAY);
 
      try {
        fbq('init', PIXEL_ID);
        fbq('track', 'PageView', {
          page_location: window.location.href,
          fbp: getCookie('_fbp'),
          fbc: getFbc(),
          cid: getClientID(),
          sid: getSessionID()
        }, { eventID: 'pageview_' + generateID() });
      } catch (error) { /* Redirect tetap berjalan jika tracking gagal. */ }
    })();
